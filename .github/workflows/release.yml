name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # 创建 GitHub release
  id-token: write # npm trusted publishing (OIDC)，配置后生效

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm test

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t folio-e2e .
      - run: docker run --rm folio-e2e

  release:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # CLI 是自包含单文件（零运行时依赖，Node ≥18 即可跑）；配 .mjs 扩展名 + shell 包装器保证裸跑
      - name: package CLI artifact
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME}"
          STAGE="dist-release/folio-${V}"
          mkdir -p "$STAGE"
          cp packages/cli/dist/cli.js "$STAGE/folio.mjs"
          cp packages/cli/package.json "$STAGE/"   # cli 的版本探测读同目录 package.json
          cat > "$STAGE/folio" <<'EOF'
          #!/bin/sh
          # folio 启动器：把同目录的 folio.mjs 交给 node 执行
          exec node "$(dirname "$0")/folio.mjs" "$@"
          EOF
          chmod +x "$STAGE/folio"
          cp LICENSE "$STAGE/"
          cat > "$STAGE/INSTALL.txt" <<'EOF'
          folio — unified local memory library for AI coding harnesses
          用法（需要 Node ≥ 18）：
            chmod +x folio && ./folio --help
          或把 folio 与 folio.mjs 一起放进 PATH（两者须同目录）：
            sudo install -m 755 folio folio.mjs /usr/local/bin/
          也可以直接走 npm：npm i -g folio-memory
          EOF
          tar czf "folio-${V}-anynode.tar.gz" -C dist-release "folio-${V}"
          ls -lh "folio-${V}-anynode.tar.gz"
      - uses: softprops/action-gh-release@v2
        with:
          files: folio-*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    # trusted publisher 已配置（tempurai/folio + 本文件），失败应当让流水线红
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # trusted publishing 要求 npm CLI ≥ 11.5.1；钉 11（npm@latest 对 Node 20 有引擎兼容问题）
      - run: npm i -g npm@^11
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: npm publish --provenance --access public
        working-directory: packages/cli
