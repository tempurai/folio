name: publish

on:
  release:
    types: [published]

permissions:
  id-token: write # npm trusted publishing (OIDC) 必需
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm test

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: docker build -f docker/Dockerfile -t folio-e2e .
      - run: docker run --rm folio-e2e

  publish:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # trusted publishing 需要较新的 npm CLI
      - run: npm i -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: npm publish --provenance --access public
        working-directory: packages/cli
